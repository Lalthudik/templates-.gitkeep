<!doctype html><html><head><meta charset="utf-8"><title>JMJ Orders</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="checkout"><h1>Orders</h1><table><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Status</th></tr>{% for o in orders %}<tr><td>{{o.order_no}}</td><td>{{o.name}}<br>{{o.phone}}</td><td>₹{{"{:,}".format(o.amount)}}</td><td>{{o.payment_method}}</td><td>{{o.payment_status}}</td></tr>{% endfor %}</table></main></body></html>
