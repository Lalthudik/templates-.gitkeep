<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Checkout | JMJ Enterprise</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><a class="brand" href="/">JMJ <small>ENTERPRISE</small></a></header><main class="checkout"><h1>Checkout</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post" class="form"><input name="name" placeholder="Full name *" required><input name="email" type="email" placeholder="Email address *" required><input name="phone" placeholder="Mobile number *" required><textarea name="address" placeholder="Full delivery address *" required></textarea><div class="two"><input name="city" placeholder="City *" required><input name="state" placeholder="State *" required></div><input name="pincode" placeholder="PIN code *" pattern="[0-9]{6}" required>
<h3>Payment</h3><label><input type="radio" name="payment_method" value="UPI" checked> UPI</label><label><input type="radio" name="payment_method" value="Card"> Card</label><label><input type="radio" name="payment_method" value="Net Banking"> Net Banking</label><label><input type="radio" name="payment_method" value="COD"> Cash on Delivery</label>
<div class="total">Payable: ₹{{"{:,}".format(total)}}</div><button class="btn" type="submit">Place Order</button><p class="note">Online payment is currently recorded as pending. Connect your live payment gateway credentials before accepting real online payments.</p></form></main></body></html>
