<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Your Basket | JMJ Enterprise</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><a class="brand" href="/">JMJ <small>ENTERPRISE</small></a><a class="cart" href="/">Continue Shopping</a></header>
<main class="checkout"><h1>Your Basket</h1>{% if items %}<div class="cartlist">{% for i in items %}<div class="cartitem"><img src="{{i.image}}"><div><h3>{{i.name}}</h3><p>₹{{"{:,}".format(i.price)}} × {{i.qty}}</p><strong>₹{{"{:,}".format(i.subtotal)}}</strong></div></div>{% endfor %}</div><div class="total">Total: ₹{{"{:,}".format(total)}}</div><a class="btn" href="/checkout">Proceed to Checkout</a>{% else %}<p>Your basket is empty.</p><a class="btn" href="/">Shop Products</a>{% endif %}</main></body></html>
